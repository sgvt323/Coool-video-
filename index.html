
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coool Video Editor</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#101018;color:#fff;font-family:Arial,sans-serif}
h1{text-align:center;color:#a78bfa}
p{color:#ccc;overflow-wrap:anywhere}
.card{background:#20202c;padding:15px;border-radius:15px;margin:14px 0}
label{display:block;margin:12px 0 5px;color:#ddd}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:9px;font-size:15px}
input,select{background:#30303d;color:white;border:1px solid #555}
input[type=range]{padding:0;accent-color:#a78bfa}
button{background:#8b5cf6;color:white;border:0;font-weight:bold}
button:disabled{opacity:.4}
video{width:100%;max-height:350px;background:#000;border-radius:10px}
.row{display:flex;gap:8px}
.row>div{flex:1;min-width:0}
#status{color:#c4b5fd}
.small{font-size:12px;color:#aaa}
</style>
</head>
<body>
<h1>🎬 Coool Video Editor</h1>
<p style="text-align:center">Edit • Effects • Speed • MP4 Export</p>

<div class="card">
<h3>📁 Video Import</h3>
<input type="file" id="file" accept="video/*">
<video id="video" controls playsinline></video>
<p id="duration">व्हिडिओ निवडा.</p>
</div>

<div class="card">
<h3>✂️ Trim Video</h3>
<div class="row"><div>
<label>Start (सेकंद)</label>
<input id="start" type="number" min="0" value="0" step=".1">
<button id="setStart" disabled>Current Time Start</button>
</div><div>
<label>End (सेकंद)</label>
<input id="end" type="number" min="0" value="0" step=".1">
<button id="setEnd" disabled>Current Time End</button>
</div></div>
</div>

<div class="card">
<h3>📐 Crop / Ratio</h3>
<label>Aspect Ratio</label>
<select id="ratio">
<option value="original">Original</option>
<option value="16:9">16:9 YouTube</option>
<option value="9:16">9:16 Reels / Shorts</option>
<option value="1:1">1:1 Square</option>
<option value="4:5">4:5 Portrait</option>
</select>
<label>Background Color</label>
<select id="bg">
<option value="black">Black</option>
<option value="white">White</option>
<option value="purple">Purple</option>
<option value="blue">Blue</option>
</select>
</div>

<div class="card">
<h3>⚡ Speed & Rotation</h3>
<label>Speed</label>
<select id="speed">
<option value=".25">0.25x Slow Motion</option>
<option value=".5">0.5x Slow</option>
<option value=".75">0.75x</option>
<option value="1" selected>1x Normal</option>
<option value="1.5">1.5x Fast</option>
<option value="2">2x Fast</option>
<option value="4">4x Fast</option>
</select>
<label>Rotation</label>
<select id="rotation">
<option value="0">Original</option>
<option value="1">90°</option>
<option value="2">180°</option>
<option value="3">270°</option>
</select>
</div>

<div class="card">
<h3>🎨 Effects & Filters</h3>
<label>Filter</label>
<select id="filter">
<option value="none">Original</option>
<option value="gray">Black & White</option>
<option value="warm">Warm Cinematic</option>
<option value="cool">Cool Cinematic</option>
<option value="vintage">Vintage</option>
<option value="invert">Invert</option>
</select>
<label>Brightness</label>
<input id="brightness" type="range" min="-.5" max=".5" step=".05" value="0">
<label>Contrast</label>
<input id="contrast" type="range" min=".5" max="2" step=".1" value="1">
<label>Saturation</label>
<input id="saturation" type="range" min="0" max="2" step=".1" value="1">
<label>Preview Background</label>
<input id="previewBg" type="color" value="#000000">
<button id="reset">↩️ Reset Effects</button>
</div>

<div class="card">
<h3>🔊 Audio</h3>
<label>Volume</label>
<input id="volume" type="range" min="0" max="2" step=".1" value="1">
<label><input id="mute" type="checkbox" style="width:auto"> Mute Original Audio</label>
</div>

<div class="card">
<h3>📤 Export Settings</h3>
<label>Resolution</label>
<select id="resolution">
<option value="720">720p HD</option>
<option value="1080" selected>1080p Full HD</option>
</select>
<label>FPS</label>
<select id="fps">
<option value="24">24 FPS</option>
<option value="30" selected>30 FPS</option>
<option value="60">60 FPS</option>
</select>
<button id="preview" disabled>▶️ Preview Selected Part</button>
<button id="export" disabled>⬇️ Export MP4</button>
<p id="status">व्हिडिओ निवडा.</p>
<p class="small">FFmpeg WebAssembly साठी इंटरनेट आवश्यक आहे. मोठे व्हिडिओ मोबाइलची RAM वापरू शकतात.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script>
const $=id=>document.getElementById(id);
const video=$('video');
let selectedFile=null,videoURL=null,ffmpeg=null,loading=null,busy=false;

function say(s){$('status').textContent=s}

function validRange(){
 const s=Number($('start').value),e=Number($('end').value);
 return !!selectedFile && Number.isFinite(video.duration) &&
 s>=0 && e>s && e<=video.duration;
}

function updateButtons(){
 const ready=!!selectedFile&&Number.isFinite(video.duration)&&video.duration>0;
 $('preview').disabled=busy||!validRange();
 $('export').disabled=busy||!validRange();
 $('setStart').disabled=busy||!ready;
 $('setEnd').disabled=busy||!ready;
}

$('file').addEventListener('change',()=>{
 const f=$('file').files[0];if(!f)return;
 if(!f.type.startsWith('video/')){say('Video file निवडा.');return}
 selectedFile=f;
 if(videoURL)URL.revokeObjectURL(videoURL);
 videoURL=URL.createObjectURL(f);
 video.src=videoURL;video.load();say('Video loading...');
});

video.addEventListener('loadedmetadata',()=>{
 $('start').value=0;
 $('end').value=video.duration.toFixed(2);
 $('duration').textContent='Duration: '+video.duration.toFixed(2)+' seconds';
 say('Video ready!');updateButtons();
});

['start','end'].forEach(id=>$(id).addEventListener('input',updateButtons));
$('setStart').onclick=()=>{$('start').value=video.currentTime.toFixed(2);updateButtons()};
$('setEnd').onclick=()=>{$('end').value=video.currentTime.toFixed(2);updateButtons()};

$('preview').onclick=async()=>{
 if(!validRange())return;
 video.currentTime=Number($('start').value);
 try{await video.play();say('Preview सुरू आहे.')}
 catch(e){say('Preview सुरू झाला नाही.')}
};

video.addEventListener('timeupdate',()=>{
 if(validRange()&&video.currentTime>=Number($('end').value)&&!video.paused)video.pause();
});

function previewStyle(){
 const filters={
  none:'',
  gray:'grayscale(1)',
  warm:'sepia(.35) saturate(1.25)',
  cool:'hue-rotate(15deg) saturate(.85)',
  vintage:'sepia(.5) contrast(.9)',
  invert:'invert(1)'
 };
 video.style.filter=
  `brightness(${1+Number($('brightness').value)}) `+
  `contrast($('contrast').value) saturate($('saturation').value) `+
  (filters[$('filter').value]||'');
 video.style.background=$('previewBg').value;
 video.style.transform=`rotate(${Number($('rotation').value)*90}deg)`;
 video.style.objectFit=$('ratio').value==='original'?'contain':'cover';
}

['filter','brightness','contrast','saturation','rotation','ratio','previewBg']
.forEach(id=>$(id).addEventListener('input',previewStyle));

$('mute').addEventListener('change',()=>{
 video.muted=$('mute').checked;
});
$('volume').addEventListener('input',()=>{
 video.volume=Number($('volume').value)/2;
});

$('reset').onclick=()=>{
 $('filter').value='none';$('brightness').value=0;
 $('contrast').value=1;$('saturation').value=1;
 $('rotation').value=0;$('ratio').value='original';
 $('previewBg').value='#000000';
 previewStyle();say('Effects reset झाले.');
};

async function getFFmpeg(){
 if(ffmpeg)return ffmpeg;
 if(loading)return loading;

 loading=(async()=>{
  if(!window.FFmpegWASM?.FFmpeg)throw Error('FFmpeg load झाले नाही. इंटरनेट तपासा.');
  const engine=new window.FFmpegWASM.FFmpeg();
  engine.on('progress',({progress})=>{
   if(Number.isFinite(progress))say('Export: '+Math.round(progress*100)+'%');
  });
  const base='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd';
  async function blobURL(url,type){
   const r=await fetch(url);if(!r.ok)throw Error('FFmpeg download failed');
   return URL.createObjectURL(new Blob([await r.arrayBuffer()],{type}));
  }
  const coreURL=await blobURL(base+'/ffmpeg-core.js','text/javascript');
  const wasmURL=await blobURL(base+'/ffmpeg-core.wasm','application/wasm');
  try{await engine.load({coreURL,wasmURL})}
  catch(e){URL.revokeObjectURL(coreURL);URL.revokeObjectURL(wasmURL);throw e}
  return engine;
 })();

 try{ffmpeg=await loading;return ffmpeg}
 catch(e){loading=null;throw e}
}

function videoFilters(){
 const res=Number($('resolution').value);
 const ratio=$('ratio').value;
 let w=res===720?1280:1920,h=res===720?720:1080;

 if(ratio==='9:16'){w=Math.round(h*9/16)}
 if(ratio==='1:1'){w=h}
 if(ratio==='4:5'){w=Math.round(h*4/5)}

 const filters=[];
 const rot=Number($('rotation').value);
 if(rot===1)filters.push('transpose=1');
 if(rot===2)filters.push('hflip','vflip');
 if(rot===3)filters.push('transpose=2');

 if(ratio==='original'){
  filters.push(`scale=${w}:${h}:force_original_aspect_ratio=decrease`);
  filters.push('pad='+w+':'+h+':(ow-iw)/2:(oh-ih)/2:'+ $('bg').value);
 }else{
  filters.push(`scale=${w}:${h}:force_original_aspect_ratio=increase`);
  filters.push(`crop=${w}:${h}`);
 }

 const f=$('filter').value;
 if(f==='gray')filters.push('hue=s=0');
 if(f==='warm')filters.push('colorbalance=rs=0.08:bs=-0.06');
 if(f==='cool')filters.push('colorbalance=rs=-0.05:bs=0.08');
 if(f==='vintage')filters.push('colorbalance=rs=0.08:bs=-0.05','eq=saturation=0.75');
 if(f==='invert')filters.push('negate');

 filters.push(
  `eq=brightness=${Number($('brightness').value)}:contrast=${Number($('contrast').value)}:saturation=${Number($('saturation').value)}`
 );
 return filters.join(',');
}

$('export').addEventListener('click',async()=>{
 if(!validRange()||busy)return;
 busy=true;updateButtons();
 const start=Number($('start').value);
 const duration=Number($('end').value)-start;
 const speed=Number($('speed').value);
 const inputName='coool-input.'+((selectedFile.name.split('.').pop()||'mp4').replace(/[^a-z0-9]/gi,''));
 const outputName='coool-video.mp4';
 let engine,url;

 try{
  say('FFmpeg सुरू होत आहे...');
  engine=await getFFmpeg();
  await engine.writeFile(inputName,new Uint8Array(await selectedFile.arrayBuffer()));

  const args=['-y','-ss',String(start),'-i',inputName,
   '-t',String(duration),'-map','0:v:0'];

  if(!$('mute').checked)args.push('-map','0:a?');

  args.push('-vf',videoFilters()+`,setpts=${1/speed}*PTS`,
   '-r',$('fps').value,'-c:v','libx264','-preset','ultrafast',
   '-pix_fmt','yuv420p','-crf','23');

  if(!$('mute').checked){
   let remaining=speed,tempo=[];
   while(remaining>2){tempo.push('atempo=2');remaining/=2}
   while(remaining<.5){tempo.push('atempo=0.5');remaining/=.5}
   tempo.push('atempo='+remaining);
   args.push('-af',tempo.join(',')+',volume='+Number($('volume').value),'-c:a','aac');
  }else args.push('-an');

  args.push('-movflags','+faststart',outputName);
  say('MP4 Export सुरू आहे...');
  const result=await engine.exec(args);
  if(result!==0)throw Error('Export failed');

  const data=await engine.readFile(outputName);
  url=URL.createObjectURL(new Blob([data],{type:'video/mp4'}));
  const a=document.createElement('a');
  a.href=url;a.download=outputName;
  document.body.appendChild(a);a.click();a.remove();
  say('MP4 तयार झाला! Downloads तपास.');
 }catch(e){
  console.error(e);say('Error: '+(e.message||'Export failed'));
 }finally{
  if(url)setTimeout(()=>URL.revokeObjectURL(url),60000);
  if(engine){
   try{await engine.deleteFile(inputName)}catch(e){}
   try{await engine.deleteFile(outputName)}catch(e){}
  }
  busy=false;updateButtons();
 }
});
</script>
</body>
</html>
