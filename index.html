
<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coool Video Editor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #101018;
      color: white;
      font-family: Arial, sans-serif;
    }
    h1 { text-align: center; color: #a78bfa; }
    p { text-align: center; color: #bbb; }
    .card {
      max-width: 600px;
      margin: 18px auto;
      padding: 18px;
      background: #20202c;
      border-radius: 16px;
      border: 1px solid #383849;
    }
    label {
      display: block;
      margin: 14px 0 8px;
      color: #ddd;
    }
    input, button {
      width: 100%;
      padding: 13px;
      margin: 6px 0;
      border-radius: 9px;
      font-size: 16px;
    }
    input[type="number"] {
      background: #30303d;
      color: white;
      border: 1px solid #555;
    }
    input[type="file"] {
      color: white;
      background: #30303d;
    }
    video {
      width: 100%;
      max-height: 350px;
      margin-top: 12px;
      background: black;
      border-radius: 12px;
    }
    button {
      background: #8b5cf6;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .45; }
    .secondary { background: #414154; }
    .times {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    #status { color: #c4b5fd; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>🎬 Coool Video Editor</h1>
  <p>Edit your videos on your phone</p>

  <div class="card">
    <label for="file">📁 मोबाईलमधून व्हिडिओ निवडा</label>
    <input id="file" type="file" accept="video/*">

    <video id="video" controls playsinline></video>
    <p id="duration">व्हिडिओ निवडलेला नाही</p>
  </div>

  <div class="card">
    <h3>✂️ व्हिडिओचा भाग निवडा</h3>

    <div class="times">
      <div>
        <label for="start">सुरुवातीची वेळ (सेकंद)</label>
        <input id="start" type="number" min="0" step="0.1" value="0">
      </div>
      <div>
        <label for="end">शेवटची वेळ (सेकंद)</label>
        <input id="end" type="number" min="0" step="0.1" value="0">
      </div>
    </div>

    <button id="preview" disabled>▶️ निवडलेला भाग पाहा</button>
    <button id="stopPreview" class="secondary" disabled>⏹️ Preview थांबवा</button>
    <button id="setStart" class="secondary" disabled>सध्याची वेळ सुरुवात म्हणून निवडा</button>
    <button id="setEnd" class="secondary" disabled>सध्याची वेळ शेवट म्हणून निवडा</button>

    <p id="status">सुरू करण्यासाठी व्हिडिओ निवड.</p>
  </div>

  <script>
    const fileInput = document.getElementById('file');
    const video = document.getElementById('video');
    const startInput = document.getElementById('start');
    const endInput = document.getElementById('end');
    const durationText = document.getElementById('duration');
    const status = document.getElementById('status');

    const previewBtn = document.getElementById('preview');
    const stopBtn = document.getElementById('stopPreview');
    const setStartBtn = document.getElementById('setStart');
    const setEndBtn = document.getElementById('setEnd');

    let videoURL = null;
    let previewing = false;

    function say(message) {
      status.textContent = message;
    }

    function updateButtons(enabled) {
      previewBtn.disabled = !enabled;
      stopBtn.disabled = !enabled;
      setStartBtn.disabled = !enabled;
      setEndBtn.disabled = !enabled;
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      if (videoURL) URL.revokeObjectURL(videoURL);
      videoURL = URL.createObjectURL(file);

      video.src = videoURL;
      video.load();
      updateButtons(false);
      say('व्हिडिओ लोड होत आहे...');
      durationText.textContent = file.name;
    });

    video.addEventListener('loadedmetadata', () => {
      if (!Number.isFinite(video.duration)) {
        say('या व्हिडिओची वेळ वाचता आली नाही.');
        return;
      }

      startInput.value = 0;
      endInput.value = video.duration.toFixed(1);
      startInput.max = video.duration;
      endInput.max = video.duration;
      durationText.textContent =
        'एकूण वेळ: ' + video.duration.toFixed(1) + ' सेकंद';

      updateButtons(true);
      say('व्हिडिओ तयार आहे. सुरुवात आणि शेवट निवड.');
    });

    function getTimes() {
      const start = Number(startInput.value);
      const end = Number(endInput.value);

      if (!video.src || !Number.isFinite(video.duration)) {
        say('आधी व्हिडिओ निवड.');
        return null;
      }

      if (
        !Number.isFinite(start) ||
        !Number.isFinite(end) ||
        start < 0 ||
        end > video.duration ||
        start >= end
      ) {
        say('योग्य वेळ निवड. शेवटची वेळ सुरुवातीपेक्षा मोठी असावी.');
        return null;
      }

      return { start, end };
    }

    previewBtn.addEventListener('click', async () => {
      const times = getTimes();
      if (!times) return;

      previewing = true;
      video.currentTime = times.start;
      say('निवडलेला भाग पाहत आहे...');
      try {
        await video.play();
      } catch (error) {
        say('व्हिडिओ सुरू करण्यासाठी Play दाब.');
      }
    });

    video.addEventListener('timeupdate', () => {
      if (previewing && video.currentTime >= Number(endInput.value)) {
        video.pause();
        previewing = false;
        say('निवडलेला भाग पूर्ण झाला.');
      }
    });

    stopBtn.addEventListener('click', () => {
      video.pause();
      previewing = false;
      say('Preview थांबवला.');
    });

    setStartBtn.addEventListener('click', () => {
      startInput.value = video.currentTime.toFixed(1);
      say('सुरुवातीची वेळ निवडली.');
    });

    setEndBtn.addEventListener('click', () => {
      endInput.value = video.currentTime.toFixed(1);
      say('शेवटची वेळ निवडली.');
    });

    startInput.addEventListener('input', () => {
      previewing = false;
      video.pause();
    });

    endInput.addEventListener('input', () => {
      previewing = false;
      video.pause();
    });

    window.addEventListener('beforeunload', () => {
      if (videoURL) URL.revokeObjectURL(videoURL);
    });
  </script>
</body>
</html>
