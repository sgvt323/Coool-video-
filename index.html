<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coool Video Editor</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: #101018;
  color: white;
  font-family: Arial, sans-serif;
}

h1 {
  text-align: center;
  color: #00e5ff;
  font-size: 27px;
}

.panel {
  background: #20202b;
  padding: 15px;
  border-radius: 14px;
  margin-bottom: 15px;
}

button, .fileButton {
  background: #00c8e8;
  color: #101018;
  border: none;
  padding: 12px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

input[type="file"] {
  display: none;
}

.fileButton {
  display: block;
  text-align: center;
  margin-bottom: 12px;
}

video {
  width: 100%;
  max-height: 350px;
  background: black;
  border-radius: 10px;
}

.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.controls button {
  flex: 1;
}

input[type="range"] {
  width: 100%;
  accent-color: #00e5ff;
}

.track {
  background: #30303e;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
}

.trackTitle {
  font-size: 13px;
  color: #bfc8d8;
  margin-bottom: 8px;
}

.timelineBar {
  height: 32px;
  border-radius: 6px;
  overflow: hidden;
  background: #454558;
  position: relative;
  cursor: pointer;
}

.videoBar {
  background: #087f8c;
}

.musicBar {
  background: #7546b8;
}

.textBar {
  background: #a56b17;
}

.playhead {
  width: 3px;
  height: 100%;
  background: white;
  position: absolute;
  top: 0;
  left: 0%;
  pointer-events: none;
}

.small {
  font-size: 12px;
  color: #bfc8d8;
}

#status {
  color: #00e5ff;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<h1>Coool Video Editor</h1>

<div class="panel">
  <h3>1. Import Video</h3>

  <label class="fileButton" for="videoFile">
    Choose Video File
  </label>

  <input
    type="file"
    id="videoFile"
    accept="video/*"
  >

  <p id="status">अजून व्हिडिओ निवडलेला नाही.</p>
</div>

<div class="panel">
  <h3>Video Preview</h3>

  <video id="video" playsinline></video>

  <div class="controls">
    <button id="playBtn">▶ Play</button>
    <button id="pauseBtn">⏸ Pause</button>
    <button id="startBtn">⏮ सुरुवात</button>
  </div>

  <p>
    <span id="currentTime">00:00</span>
    /
    <span id="duration">00:00</span>
  </p>

  <input
    type="range"
    id="seek"
    min="0"
    max="1000"
    value="0"
  >
</div>

<div class="panel">
  <h3>2. Timeline — Multiple Tracks</h3>
  <p class="small">
    टाइमलाइनवर टॅप करून व्हिडिओची जागा बदला.
  </p>

  <div class="track">
    <div class="trackTitle">🎬 VIDEO LINE</div>
    <div class="timelineBar videoBar" id="videoTrack">
      <div class="playhead" id="videoHead"></div>
    </div>
  </div>

  <div class="track">
    <div class="trackTitle">🎵 MUSIC LINE</div>
    <div class="timelineBar musicBar" id="musicTrack">
      <div class="playhead" id="musicHead"></div>
    </div>
    <label class="fileButton" for="musicFile">
      ＋ Add Music
    </label>
    <input
      type="file"
      id="musicFile"
      accept="audio/*"
    >
    <p class="small" id="musicStatus">
      संगीत निवडलेले नाही.
    </p>
  </div>

  <div class="track">
    <div class="trackTitle">📝 TEXT LINE</div>
    <div class="timelineBar textBar" id="textTrack">
      <div class="playhead" id="textHead"></div>
    </div>
    <p class="small">
      ही सध्या टाइमलाइनची जागा दाखवणारी लाइन आहे.
    </p>
  </div>
</div>

<script>
const video = document.getElementById("video");
const videoFile = document.getElementById("videoFile");
const musicFile = document.getElementById("musicFile");
const seek = document.getElementById("seek");
const status = document.getElementById("status");

let videoURL = null;
let musicURL = null;
let music = new Audio();

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "00:00";

  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);

  return String(mins).padStart(2, "0") + ":" +
         String(secs).padStart(2, "0");
}

videoFile.addEventListener("change", function () {
  const file = this.files[0];
  if (!file) return;

  if (videoURL) URL.revokeObjectURL(videoURL);

  videoURL = URL.createObjectURL(file);
  video.src = videoURL;
  video.load();

  status.textContent = "निवडलेला व्हिडिओ: " + file.name;
});

video.addEventListener("loadedmetadata", function () {
  document.getElementById("duration").textContent =
    formatTime(video.duration);

  updateTimeline();
});

document.getElementById("playBtn").addEventListener("click", async () => {
  if (!video.src) {
    alert("आधी व्हिडिओ निवड भाऊ!");
    return;
  }

  try {
    await video.play();

    if (music.src) {
      music.currentTime = Math.min(
        video.currentTime,
        Number.isFinite(music.duration) ? music.duration : 0
      );

      music.play().catch(() => {});
    }
  } catch (error) {
    alert("व्हिडिओ सुरू झाला नाही. पुन्हा प्रयत्न कर.");
  }
});

document.getElementById("pauseBtn").addEventListener("click", () => {
  video.pause();
  music.pause();
});

document.getElementById("startBtn").addEventListener("click", () => {
  video.currentTime = 0;
  music.currentTime = 0;
  updateTimeline();
});

seek.addEventListener("input", function () {
  if (!Number.isFinite(video.duration) || video.duration <= 0) return;

  video.currentTime = (Number(this.value) / 1000) * video.duration;
  updateTimeline();
});

video.addEventListener("timeupdate", updateTimeline);

function updateTimeline() {
  const duration = video.duration;

  document.getElementById("currentTime").textContent =
    formatTime(video.currentTime);

  if (!Number.isFinite(duration) || duration <= 0) return;

  const progress = (video.currentTime / duration) * 100;

  seek.value = Math.round(progress * 10);

  document.getElementById("videoHead").style.left =
    progress + "%";

  document.getElementById("musicHead").style.left =
    progress + "%";

  document.getElementById("textHead").style.left =
    progress + "%";
}

function seekFromTrack(event) {
  if (!Number.isFinite(video.duration) || video.duration <= 0) {
    alert("आधी व्हिडिओ निवड.");
    return;
  }

  const rect = event.currentTarget.getBoundingClientRect();

  const position = Math.max(
    0,
    Math.min(1, (event.clientX - rect.left) / rect.width)
  );

  video.currentTime = position * video.duration;
  updateTimeline();
}

document.getElementById("videoTrack")
  .addEventListener("click", seekFromTrack);

document.getElementById("musicTrack")
  .addEventListener("click", seekFromTrack);

document.getElementById("textTrack")
  .addEventListener("click", seekFromTrack);

musicFile.addEventListener("change", function () {
  const file = this.files[0];
  if (!file) return;

  if (musicURL) URL.revokeObjectURL(musicURL);

  musicURL = URL.createObjectURL(file);
  music.src = musicURL;

  document.getElementById("musicStatus").textContent =
    "निवडलेले संगीत: " + file.name;
});

video.addEventListener("seeked", () => {
  if (music.src && !video.paused) {
    music.currentTime = Math.min(
      video.currentTime,
      Number.isFinite(music.duration) ? music.duration : 0
    );
  }
});

music.addEventListener("ended", () => {
  music.pause();
});
</script>

</body>
</html>
